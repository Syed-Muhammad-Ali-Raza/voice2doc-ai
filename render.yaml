services:
  - type: web
    name: voice2doc-ai
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_USE_MOCK_API
        value: "false"
